<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panier – Hosna Kids</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .cart-page { max-width: 900px; margin: 0 auto; padding: 40px 40px 80px; }
    .cart-title { font-size: 28px; font-weight: 400; margin-bottom: 28px; }
    .cart-item {
      display: grid; grid-template-columns: 80px 1fr auto auto; gap: 16px; align-items: center;
      padding: 16px 0; border-bottom: 1px solid var(--border);
    }
    .cart-item img { width: 80px; height: 80px; object-fit: cover; border-radius: 8px; background: var(--gray-light); }
    .cart-item-name { font-weight: 500; font-size: 14px; margin-bottom: 4px; }
    .cart-item-taille { font-size: 12px; color: var(--gray); }
    .cart-qty { display: flex; align-items: center; gap: 8px; }
    .cart-qty-btn { width: 26px; height: 26px; border-radius: 50%; border: 1.5px solid var(--border); background: white; cursor: pointer; font-size: 15px; }
    .cart-item-price { font-weight: 600; font-size: 14px; white-space: nowrap; text-align: right; }
    .cart-item-remove { background: none; border: none; color: #dc2626; cursor: pointer; font-size: 13px; margin-top: 4px; }
    .cart-empty { text-align: center; padding: 80px 20px; color: var(--gray); }
    .cart-empty a { display: inline-block; margin-top: 16px; padding: 12px 28px; background: #1a1a1a; color: white; border-radius: 6px; font-weight: 600; }
    .livraison-section { margin: 20px 0; }
    .livraison-options { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 8px; }
    .livraison-card {
      border: 2px solid var(--border); border-radius: 10px; padding: 14px;
      cursor: pointer; transition: all 0.2s; background: white; text-align: center;
    }
    .livraison-card:hover { border-color: #8B6B4A; }
    .livraison-card.selected { border-color: #1a1a1a; background: #f9f7f4; }
    .livraison-card .lv-icon { font-size: 28px; margin-bottom: 6px; }
    .livraison-card .lv-type { font-size: 14px; font-weight: 600; margin-bottom: 4px; }
    .livraison-card .lv-price { font-size: 16px; font-weight: 700; color: #e05c1a; }
    .livraison-card .lv-desc { font-size: 11px; color: #6b7280; margin-top: 2px; }
    .total-box { background: #f9f7f4; border: 1.5px solid #e0d8cc; border-radius: 12px; padding: 16px 20px; margin: 24px 0 16px; }
    .total-row { display: flex; justify-content: space-between; font-size: 14px; margin-bottom: 6px; color: #6b7280; }
    .total-row.final { font-size: 16px; font-weight: 700; color: #1a1a1a; margin-bottom: 0; padding-top: 10px; border-top: 1px solid #e0d8cc; }
    .total-row.final span:last-child { color: #e05c1a; font-size: 18px; }
  </style>
</head>
<body>

<div class="announce-bar">Welcome to Hosna kids 🎀</div>

<nav class="navbar">
  <div class="nav-left">
    <a href="index.html" class="nav-link">Home</a>
  </div>
  <div class="nav-center">
    <a href="index.html"><img src="Asset 8@2x.png" alt="Hosna Kids" class="logo-img"></a>
  </div>
  <div class="nav-right">
    <button class="icon-btn">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
    </button>
    <a href="cart.html" class="icon-btn" style="position:relative">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 01-8 0"/></svg>
      <span id="cartBadge" class="cart-badge" style="display:none">0</span>
    </a>
  </div>
</nav>

<div class="cart-page">
  <h1 class="cart-title">Votre panier</h1>
  <div id="cartItemsWrap"></div>
  <div id="checkoutWrap"></div>
</div>

<div class="success-overlay" id="successOverlay">
  <div class="success-box">
    <div style="font-size:56px;margin-bottom:12px">🎉</div>
    <h2>Commande confirmée !</h2>
    <p id="successMsg"></p>
    <button onclick="location.href='index.html'">Continuer les achats</button>
  </div>
</div>

<footer class="footer">
  <img src="Asset 8@2x.png" alt="Hosna Kids" style="height:48px;opacity:0.8;margin-bottom:12px">
  <p><strong>Hosna Kids</strong> — Mode Enfant · Oran</p>
  <p style="opacity:0.5;font-size:12px;margin-top:6px">© 2026 Hosna Kids. Tous droits réservés.</p>
</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script src="announce-bar.js"></script>
<script src="cart.js"></script>
<script src="livraison.js"></script>
<script src="communes.js"></script>
<script>
  const GOOGLE_SHEETS_URL = "https://script.google.com/macros/s/AKfycbxwaf1VXMR5pIrLBLlgnLzeq8eWwzIEwks9rDl4WkZzeqswsQ93sIWY471wQkYXC94W/exec";
  let selectedLivraison = '';
  let prixLivraison     = 0;

  function renderCart() {
    updateCartBadge();
    const cart = getCart();
    const itemsWrap = document.getElementById('cartItemsWrap');
    const checkoutWrap = document.getElementById('checkoutWrap');

    if (!cart.length) {
      itemsWrap.innerHTML = `<div class="cart-empty">Votre panier est vide.<br><a href="index.html">Voir les produits →</a></div>`;
      checkoutWrap.innerHTML = '';
      return;
    }

    itemsWrap.innerHTML = cart.map(item => `
      <div class="cart-item">
        <img src="${item.image || ''}" alt="${item.nom}" onerror="this.style.display='none'">
        <div>
          <div class="cart-item-name">${item.nom}</div>
          <div class="cart-item-taille">Taille : ${item.taille}</div>
          <button class="cart-item-remove" onclick="removeFromCart(${item.id}, '${item.taille}'); renderCart();">Retirer</button>
        </div>
        <div class="cart-qty">
          <button class="cart-qty-btn" onclick="updateCartQty(${item.id}, '${item.taille}', ${item.quantite - 1}); renderCart();">−</button>
          <span>${item.quantite}</span>
          <button class="cart-qty-btn" onclick="updateCartQty(${item.id}, '${item.taille}', ${item.quantite + 1}); renderCart();">+</button>
        </div>
        <div class="cart-item-price">${(Number(item.prix) * item.quantite).toLocaleString('fr-DZ')} DA</div>
      </div>`).join('');

    const wilayasHTML = WILAYAS_LIVRAISON.map(w => `<option value="${w.nom}">${w.nom}</option>`).join('');

    checkoutWrap.innerHTML = `
      <div class="order-form" style="margin-top:24px">
        <div class="form-field">
          <label class="form-label-ar">الاسم كامل <span class="req">*</span></label>
          <div class="input-wrap"><span class="input-icon">👤</span><input type="text" id="f-nom" placeholder="Nom Complet"></div>
        </div>
        <div class="form-field">
          <label class="form-label-ar">رقم الهاتف <span class="req">*</span></label>
          <div class="input-wrap"><span class="input-icon">📱</span><input type="tel" id="f-tel" placeholder="Numéro"></div>
        </div>
        <div class="form-field">
          <label class="form-label-ar">الولاية <span class="req">*</span></label>
          <div class="select-wrap">
            <select id="f-wilaya" onchange="onWilayaChange(this.value)" required>
              <option value="">Wilaya</option>${wilayasHTML}
            </select>
            <span class="select-arrow">▾</span>
          </div>
        </div>
        <div class="form-field">
          <label class="form-label-ar">البلدية</label>
          <div class="select-wrap">
            <select id="f-commune"><option value="">Commune</option></select>
            <span class="select-arrow">▾</span>
          </div>
        </div>

        <div class="livraison-section" id="livraisonSection" style="display:none">
          <label class="field-label">Type de livraison <span style="color:red">✱</span></label>
          <div class="livraison-options">
            <div class="livraison-card" id="card-domicile" onclick="selectLivraison('domicile')">
              <div class="lv-icon">🏠</div>
              <div class="lv-type">Domicile</div>
              <div class="lv-price" id="price-domicile">— DA</div>
              <div class="lv-desc">Livraison chez vous</div>
            </div>
            <div class="livraison-card" id="card-bureau" onclick="selectLivraison('bureau')">
              <div class="lv-icon">🏢</div>
              <div class="lv-type">Bureau / Point relais</div>
              <div class="lv-price" id="price-bureau">— DA</div>
              <div class="lv-desc">Retrait au bureau</div>
            </div>
          </div>
        </div>

        <div class="total-box" id="totalBox" style="display:none">
          <div class="total-row"><span>Sous-total (${cartCount()} article${cartCount()>1?'s':''})</span><span id="tot-produit">—</span></div>
          <div class="total-row"><span>Frais de livraison</span><span id="tot-livraison">—</span></div>
          <div class="total-row final"><span>Total à payer</span><span id="tot-final">—</span></div>
        </div>

        <button class="order-btn" id="orderBtn" onclick="submitCartOrder()">🛒 اشتري الآن</button>
      </div>`;

    // Pré-remplir avec les infos déjà enregistrées (fiche produit ou visite précédente)
    const saved = getCustomerInfo();
    if (saved.nom)    document.getElementById('f-nom').value = saved.nom;
    if (saved.tel)    document.getElementById('f-tel').value = saved.tel;
    if (saved.wilaya) {
      document.getElementById('f-wilaya').value = saved.wilaya;
      onWilayaChange(saved.wilaya);
      if (saved.commune) document.getElementById('f-commune').value = saved.commune;
    }
  }

  function onWilayaChange(wilaya) {
    if (!wilaya) return;
    updateCommunes(wilaya);
    const info = getLivraisonInfo(wilaya);
    document.getElementById('price-domicile').textContent = info.domicile.toLocaleString('fr-DZ') + ' DA';
    document.getElementById('price-bureau').textContent   = info.bureau.toLocaleString('fr-DZ') + ' DA';
    document.getElementById('livraisonSection').style.display = 'block';
    selectedLivraison = ''; prixLivraison = 0;
    document.querySelectorAll('.livraison-card').forEach(c => c.classList.remove('selected'));
    updateCartTotal();
  }

  function selectLivraison(type) {
    const wilaya = document.getElementById('f-wilaya').value;
    const info   = getLivraisonInfo(wilaya);
    selectedLivraison = type;
    prixLivraison     = type === 'domicile' ? info.domicile : info.bureau;
    document.querySelectorAll('.livraison-card').forEach(c => c.classList.remove('selected'));
    document.getElementById('card-' + type).classList.add('selected');
    updateCartTotal();
  }

  function updateCartTotal() {
    if (!selectedLivraison) { document.getElementById('totalBox').style.display = 'none'; return; }
    const sousTotal = cartTotal();
    const total     = sousTotal + prixLivraison;
    document.getElementById('totalBox').style.display    = 'block';
    document.getElementById('tot-produit').textContent   = sousTotal.toLocaleString('fr-DZ') + ' DA';
    document.getElementById('tot-livraison').textContent = prixLivraison.toLocaleString('fr-DZ') + ' DA';
    document.getElementById('tot-final').textContent     = total.toLocaleString('fr-DZ') + ' DA';
  }

  async function submitCartOrder() {
    const nom     = document.getElementById('f-nom').value.trim();
    const tel     = document.getElementById('f-tel').value.trim();
    const wilaya  = document.getElementById('f-wilaya').value;
    const commune = document.getElementById('f-commune').value;
    if (!tel) { alert('Veuillez entrer votre numéro.'); return; }

    saveCustomerInfo({ nom, tel, wilaya, commune });

    const cart = getCart();
    if (!cart.length) return;

    const btn = document.getElementById('orderBtn');
    btn.disabled = true;
    btn.textContent = '⏳ Envoi...';

    const sousTotal = cartTotal();
    const total     = sousTotal + prixLivraison;

    const articles = cart.map(item => ({
      produit: item.nom, taille: item.taille, quantite: item.quantite,
      prix_unitaire: Number(item.prix), sous_total: Number(item.prix) * item.quantite,
      id: item.id
    }));

    const commande = {
      date: new Date().toLocaleString('fr-DZ'),
      nom, telephone: tel, wilaya,
      commune: commune || '—',
      produit: cart.map(i => `${i.nom} (${i.taille} ×${i.quantite})`).join(', '),
      taille: cartCount() + ' article(s)',
      quantite: cartCount(),
      livraison: selectedLivraison === 'domicile' ? '🏠 Domicile' : '🏢 Bureau',
      prix_livraison: prixLivraison + ' DA',
      prix_produit: sousTotal + ' DA',
      total: total + ' DA',
      statut: 'Nouvelle commande',
      articles
    };

    try {
      const { error: orderError } = await sb.from('commandes').insert(commande);
      if (orderError) throw orderError;

      fetch(GOOGLE_SHEETS_URL, {
        method: 'POST', mode: 'no-cors',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(commande)
      }).catch(e => console.log('Google Sheets sync error:', e));

      if (typeof fbq === 'function') {
        fbq('track', 'Purchase', {
          value: total, currency: 'DZD',
          contents: cart.map(i => ({ id: i.id, quantity: i.quantite })),
          content_type: 'product'
        });
      }

      for (const item of cart) {
        try {
          await sb.rpc('decrement_stock', { p_id: item.id, p_taille: item.taille, p_qty: item.quantite });
        } catch (e) { console.log('Stock update error:', e); }
      }

      document.getElementById('successMsg').innerHTML =
        `Merci <strong>${nom}</strong> ! ✅<br>
         ${cartCount()} article(s) commandé(s)<br>
         Livraison <strong>${selectedLivraison === 'domicile' ? '🏠 à domicile' : '🏢 bureau'}</strong> à <strong>${wilaya}</strong><br><br>
         <strong style="color:#e05c1a;font-size:18px">${total.toLocaleString('fr-DZ')} DA</strong><br><br>
         Nous vous appellerons au <strong>${tel}</strong> pour confirmer. 🚚`;
      document.getElementById('successOverlay').classList.add('show');

      clearCart();
      renderCart();
    } catch (e) {
      alert('❌ Une erreur est survenue, merci de réessayer.');
      console.log(e);
    } finally {
      btn.disabled = false;
      btn.innerHTML = '🛒 اشتري الآن';
    }
  }

  loadLivraisonTarifs().then(() => renderCart());
</script>
</body>
</html>
