<body>

<div class="announce-bar">Welcome to Hosna kids 🎀</div>

<nav class="navbar">
  <div class="nav-left">
    <a href="index.html" class="nav-link active">Home</a>
  </div>
  <div class="nav-center">
    <a href="index.html"><img src="Asset 8@2x.png" alt="Hosna Kids" class="logo-img"></a>
  </div>
  <div class="nav-right">
    <button class="icon-btn">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
    </button>
    <button class="icon-btn">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
    </button>
    <button class="icon-btn">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 01-8 0"/></svg>
    </button>
  </div>
</nav>

<section class="hero">
  <div class="hero-content">
    <p class="hero-sub">Nouvelle Collection 2026</p>
    <h1>Mode Enfant<br><span>Douce & Tendance</span></h1>
    <p class="hero-desc">Des vêtements de qualité pour vos petits, livrés dans les 58 wilayas</p>
    <a href="#products" class="hero-btn">Voir la collection →</a>
  </div>
</section>

<section id="promoSection"></section>

<div class="catalog-header" id="products">
  <h1>Products</h1>
</div>

<div class="catalog-toolbar">
  <div class="filter-group">
    <span class="toolbar-label">Filter:</span>
    <button class="toolbar-btn active" onclick="filterCat(this,'all')">See All</button>
    <button class="toolbar-btn" onclick="filterCat(this,'fille')">👧 Fille</button>
    <button class="toolbar-btn" onclick="filterCat(this,'garcon')">👦 Garçon</button>
  </div>
  <div class="sort-group">
    <span class="toolbar-label" id="prodCount"></span>
    <select class="sort-select" onchange="sortProducts(this.value)">
      <option value="ordre">Recommandé</option>
      <option value="alpha">Alphabetically, A-Z</option>
      <option value="price-asc">Prix croissant</option>
      <option value="price-desc">Prix décroissant</option>
    </select>
  </div>
</div>

<div class="catalog-grid" id="homeGrid">
  <div class="skeleton-card"><div class="skeleton-img"></div><div class="skeleton-line" style="width:60%"></div><div class="skeleton-line" style="width:40%"></div></div>
  <div class="skeleton-card"><div class="skeleton-img"></div><div class="skeleton-line" style="width:60%"></div><div class="skeleton-line" style="width:40%"></div></div>
  <div class="skeleton-card"><div class="skeleton-img"></div><div class="skeleton-line" style="width:60%"></div><div class="skeleton-line" style="width:40%"></div></div>
  <div class="skeleton-card"><div class="skeleton-img"></div><div class="skeleton-line" style="width:60%"></div><div class="skeleton-line" style="width:40%"></div></div>
</div>

<footer class="footer">
  <img src="Asset 8@2x.png" alt="Hosna Kids" style="height:48px;opacity:0.8;margin-bottom:12px">
  <p><strong>Hosna Kids</strong> — Mode Enfant · Oran</p>
  <p style="opacity:0.5;font-size:12px;margin-top:6px">© 2026 Hosna Kids. Tous droits réservés.</p>
</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script src="announce-bar.js"></script>
<script src="products-loader.js"></script>
<script>
  let currentCat  = 'all';
  let currentSort = 'ordre';

  function getFiltered() {
    let list = currentCat === 'all' ? [...products] : products.filter(p => p.cat === currentCat);
    if (currentSort === 'alpha')      list.sort((a,b) => a.nom.localeCompare(b.nom));
    if (currentSort === 'price-asc')  list.sort((a,b) => a.prix - b.prix);
    if (currentSort === 'price-desc') list.sort((a,b) => b.prix - a.prix);
    // 'ordre' : on garde l'ordre défini dans l'admin, sans trier.
    return sortOutOfStockLast(list); // les produits en rupture passent toujours en dernier
  }

  function renderHome() {
    const list = getFiltered();
    document.getElementById('prodCount').textContent = list.length + ' products';
    const grid = document.getElementById('homeGrid');
    if (!list.length) {
      grid.innerHTML = '<div style="grid-column:1/-1;text-align:center;padding:60px;color:#6b7280">Aucun produit dans cette catégorie</div>';
      return;
    }
    grid.innerHTML = list.map(p => `
      <a href="product.html?id=${p.id}" class="product-card">
        <div class="product-img-wrap">
          <img src="${p.images && p.images[0] ? p.images[0] : ''}" alt="${p.nom}" loading="lazy"
            onerror="this.parentElement.innerHTML='<div style=\'width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:56px;background:#f3f4f6\'>${p.cat==='fille'?'👗':'👕'}</div>'">
        </div>
        <div class="product-info">
          <p class="product-brand">HOSNA KIDS</p>
          <h3 class="product-name">${p.nom}</h3>
          <p class="product-price">${Number(p.prix).toLocaleString('fr-DZ')} DA</p>
        </div>
      </a>`).join('');
  }

  function filterCat(btn, cat) {
    document.querySelectorAll('.toolbar-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentCat = cat;
    renderHome();
  }

  function sortProducts(val) { currentSort = val; renderHome(); }

  loadProducts().then(() => renderHome());
  window.addEventListener('products-updated', renderHome);

  // ── PROMOTIONS ACTIVES ──
  async function loadPromo() {
    try {
      const { data, error } = await sb.from('promos').select('*').eq('active', true).order('created_at', { ascending: false });
      if (error) throw error;
      if (Array.isArray(data) && data.length > 0) renderPromoBanners(data);
    } catch (e) {
      console.log('Promo fetch error:', e);
    }
  }

  function renderPromoBanners(promoList) {
    const section = document.getElementById('promoSection');
    section.innerHTML = `<div class="promo-banner">` + promoList.map(promo => `
        <a href="promo.html?id=${promo.id}" class="promo-banner-inner" style="text-decoration:none;color:inherit">
          <img src="${(promo.images && promo.images[0]) || ''}" alt="${promo.titre}" class="promo-banner-img" onerror="this.style.display='none'">
          <div>
            <h3 class="promo-banner-title">${promo.titre}</h3>
            ${promo.description ? `<p class="promo-banner-desc">${promo.description}</p>` : ''}
            <p class="promo-banner-price">
              ${promo.prix_original ? `<span class="promo-price-barre">${Number(promo.prix_original).toLocaleString('fr-DZ')} DA</span>` : ''}
              <span class="promo-price-final">${Number(promo.prix).toLocaleString('fr-DZ')} DA</span>
            </p>
          </div>
        </a>`).join('') + `</div>`;
  }

  loadPromo();
</script>
</body>
</html>
