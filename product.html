<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Produit – Hosna Kids</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .livraison-section { margin:20px 0; }
    .livraison-options { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:8px; }
    .livraison-card {
      border:2px solid var(--border); border-radius:10px; padding:14px;
      cursor:pointer; transition:all 0.2s; background:white; text-align:center;
    }
    .livraison-card:hover { border-color:#8B6B4A; }
    .livraison-card.selected { border-color:#1a1a1a; background:#f9f7f4; }
    .livraison-card .lv-icon { font-size:28px; margin-bottom:6px; }
    .livraison-card .lv-type { font-size:14px; font-weight:600; margin-bottom:4px; }
    .livraison-card .lv-price { font-size:16px; font-weight:700; color:#e05c1a; }
    .livraison-card .lv-desc { font-size:11px; color:#6b7280; margin-top:2px; }

    .total-box {
      background:#f9f7f4; border:1.5px solid #e0d8cc;
      border-radius:12px; padding:16px 20px; margin:16px 0;
    }
    .total-row { display:flex; justify-content:space-between; font-size:14px; margin-bottom:6px; color:#6b7280; }
    .total-row.final { font-size:16px; font-weight:700; color:#1a1a1a; margin-bottom:0; padding-top:10px; border-top:1px solid #e0d8cc; }
    .total-row.final span:last-child { color:#e05c1a; font-size:18px; }

    .qty-selector { display:flex; align-items:center; gap:12px; margin-top:8px; }
    .qty-btn { width:32px; height:32px; border-radius:50%; border:1.5px solid var(--border); background:white; font-size:18px; cursor:pointer; display:flex; align-items:center; justify-content:center; transition:all 0.15s; }
    .qty-btn:hover { border-color:#1a1a1a; }
    .qty-num { font-size:16px; font-weight:600; min-width:28px; text-align:center; }
    .stock-badge { font-size:12px; color:#6b7280; margin-left:8px; }
    .stock-badge.low { color:#dc2626; font-weight:600; }
    .stock-badge.out { color:#dc2626; font-weight:700; }
  </style>

  !function(f,b,e,v,n,t,s)

  n.callMethod.apply(n,arguments):n.queue.push(arguments)};

  n.queue=[];t=b.createElement(e);t.async=!0;
  t.src=v;s=b.getElementsByTagName(e)[0];
  s.parentNode.insertBefore(t,s)}(window, document,'script',
  'https://connect.facebook.net/en_US/fbevents.js');
  fbq('init', '955597250641032');
  fbq('track', 'PageView');
  </script>
  <noscript><img height="1" width="1" style="display:none"
  src="https://www.facebook.com/tr?id=955597250641032&ev=PageView&noscript=1"
  /></noscript>

</head>
<body>

<div class="announce-bar">Welcome to Hosna kids 🎀</div>

<nav class="navbar">
  <div class="nav-left">
    <a href="index.html" class="nav-link">Home</a>
    <a href="catalog.html" class="nav-link">Catalog</a>
    <a href="index.html#contact" class="nav-link">Contact</a>
  </div>
  <div class="nav-center">
    <a href="index.html"><img src="Asset 8@2x.png" alt="Hosna Kids" class="logo-img"></a>
  </div>
  <div class="nav-right">
    <button class="icon-btn">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
    </button>
    <button class="icon-btn">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
    </button>
    <button class="icon-btn">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 01-8 0"/></svg>
    </button>
  </div>
</nav>

<div class="breadcrumb">
  <a href="index.html">Home</a> / <a href="catalog.html">Catalog</a> / <span id="breadName">...</span>
</div>

<div class="product-page" id="productPage">
  <div style="grid-column:1/-1;text-align:center;padding:80px;color:#6b7280">⏳ Chargement...</div>
</div>

<section class="section" style="padding-top:0" id="relatedSection">
  <h2 class="section-title" style="text-align:left">You may also like</h2>
  <div class="products-grid" id="relatedGrid"></div>
</section>

<div class="success-overlay" id="successOverlay">
  <div class="success-box">
    <div style="font-size:56px;margin-bottom:12px">🎉</div>
    <h2>Commande confirmée !</h2>
    <p id="successMsg"></p>
    <button onclick="document.getElementById('successOverlay').classList.remove('show')">Continuer les achats</button>
  </div>
</div>

<div class="buy-reminder-banner" id="buyReminderBanner">
  <div class="buy-reminder-content">
    <span>🛒 N'oubliez pas de cliquer sur <b>« اشتري الآن »</b> pour valider votre commande !</span>
    <div style="display:flex;gap:8px;align-items:center;flex-shrink:0">
      <button class="buy-reminder-cta" onclick="scrollToBuyButton()">Finaliser</button>
      <button class="buy-reminder-close" onclick="dismissBuyReminder()">✕</button>
    </div>
  </div>
</div>

<footer class="footer">
  <img src="Asset 8@2x.png" alt="Hosna Kids" style="height:48px;opacity:0.8;margin-bottom:12px">
  <p><strong>Hosna Kids</strong> — Mode Enfant · Oran</p>
  <p style="opacity:0.5;font-size:12px;margin-top:6px">© 2026 Hosna Kids. Tous droits réservés.</p>
</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script src="products-loader.js"></script>
<script src="livraison.js"></script>
<script src="communes.js"></script>
<script>

  const params = new URLSearchParams(location.search);
  const pid = params.get('id');
  const GOOGLE_SHEETS_URL = "https://script.google.com/macros/s/AKfycbxwaf1VXMR5pIrLBLlgnLzeq8eWwzIEwks9rDl4WkZzeqswsQ93sIWY471wQkYXC94W/exec";
  let selectedSize     = '';
  let selectedLivraison = '';
  let prixLivraison    = 0;
  let quantite         = 1;
  let stockDispo       = 0;
  let p;
  let orderSubmitted   = false;
  let abandonSent      = false;
  let abandonRecordId  = null;

  Promise.all([loadProducts(), loadLivraisonTarifs()]).then(() => {
    p = products.find(x => String(x.id) === String(pid)) || products[0];
    if (!p) {
      document.getElementById('productPage').innerHTML = '<div style="grid-column:1/-1;text-align:center;padding:80px">Produit introuvable</div>';
      return;
    }

    document.title = p.nom + ' – Hosna Kids';
    document.getElementById('breadName').textContent = p.nom;

    const imgs = (p.images && p.images.length) ? p.images : [''];

    const thumbsHTML = imgs.map((img, i) =>
      `<img src="${img}" class="thumb${i===0?' active':''}" onclick="changeImg(this,'${img}')" alt="${p.nom}" onerror="this.style.display='none'">`
    ).join('');

    // Tailles avec stock
    const stock = p.stock || {};
    const taillesHTML = (p.tailles || []).map(t => {
      const qt = stock[t] !== undefined ? Number(stock[t]) : 99;
      const cls = qt === 0 ? 'style="opacity:0.4;cursor:not-allowed;text-decoration:line-through"' : '';
      return `<button class="size-chip" onclick="selectSize(this,'${t}',${qt})" ${qt===0?'disabled':''} ${cls}>${t}</button>`;
    }).join('');

    // Wilayas
    const wilayasHTML = WILAYAS_LIVRAISON.map(w => `<option value="${w.nom}">${w.nom}</option>`).join('');

    document.getElementById('productPage').innerHTML = `
      <div class="product-gallery">
        <div class="main-img-wrap">
          <img id="mainImg" src="${imgs[0]}" alt="${p.nom}" onerror="this.src=''">
        </div>
        <div class="thumb-strip">${thumbsHTML}</div>
      </div>

      <div class="product-details">
        <p class="detail-brand">HOSNA KIDS</p>
        <h1 class="detail-name">${p.nom}</h1>
        <p class="detail-price" id="detailPrice">${Number(p.prix).toLocaleString('fr-DZ')} DA</p>
        <p class="detail-desc">${p.description || ''}</p>
        <p class="detail-delivery">🚚 Livraison disponible dans les 58 wilayas.</p>

        <!-- TAILLE -->
        <div class="size-section">
          <label class="field-label">taille</label>
          <div class="size-grid">${taillesHTML}</div>
        </div>

        <!-- QUANTITÉ -->
        <div class="size-section" id="qtySection" style="display:none">
          <label class="field-label">Quantité</label>
          <div class="qty-selector">
            <button class="qty-btn" onclick="changeQty(-1)">−</button>
            <span class="qty-num" id="qtyNum">1</span>
            <button class="qty-btn" onclick="changeQty(1)">+</button>
            <span class="stock-badge" id="stockBadge"></span>
          </div>
        </div>

        <!-- FORMULAIRE -->
        <div class="order-form">
          <div class="form-field">
            <label class="form-label-ar">الاسم كامل <span class="req">*</span></label>
            <div class="input-wrap"><span class="input-icon">👤</span><input type="text" id="f-nom" placeholder="Nom Complet"></div>
          </div>
          <div class="form-field">
            <label class="form-label-ar">رقم الهاتف <span class="req">*</span></label>
            <div class="input-wrap"><span class="input-icon">📱</span><input type="tel" id="f-tel" placeholder="Numéro"></div>
          </div>

          <!-- WILAYA -->
          <div class="form-field">
            <label class="form-label-ar">الولاية <span class="req">*</span></label>
            <div class="select-wrap">
              <select id="f-wilaya" onchange="onWilayaChange(this.value)" required>
                <option value="">Wilaya</option>${wilayasHTML}
              </select>
              <span class="select-arrow">▾</span>
            </div>
          </div>

          <div class="form-field">
            <label class="form-label-ar">البلدية</label>
            <div class="select-wrap">
              <select id="f-commune"><option value="">Commune</option></select>
              <span class="select-arrow">▾</span>
            </div>
          </div>

          <!-- TYPE LIVRAISON -->
          <div class="livraison-section" id="livraisonSection" style="display:none">
            <label class="field-label">Type de livraison <span style="color:red">✱</span></label>
            <div class="livraison-options">
              <div class="livraison-card" id="card-domicile" onclick="selectLivraison('domicile')">
                <div class="lv-icon">🏠</div>
                <div class="lv-type">Domicile</div>
                <div class="lv-price" id="price-domicile">— DA</div>
                <div class="lv-desc">Livraison chez vous</div>
              </div>
              <div class="livraison-card" id="card-bureau" onclick="selectLivraison('bureau')">
                <div class="lv-icon">🏢</div>
                <div class="lv-type">Bureau / Point relais</div>
                <div class="lv-price" id="price-bureau">— DA</div>
                <div class="lv-desc">Retrait au bureau</div>
              </div>
            </div>
          </div>

          <!-- TOTAL -->
          <div class="total-box" id="totalBox" style="display:none">
            <div class="total-row">
              <span>Prix produit × <span id="tot-qty">1</span></span>
              <span id="tot-produit">—</span>
            </div>
            <div class="total-row">
              <span>Frais de livraison</span>
              <span id="tot-livraison">—</span>
            </div>
            <div class="total-row final">
              <span>Total à payer</span>
              <span id="tot-final">—</span>
            </div>
          </div>

          <button class="order-btn" id="orderBtn" onclick="submitOrder()">🛒 اشتري الآن</button>
        </div>

        <div class="share-row">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 12v8a2 2 0 002 2h12a2 2 0 002-2v-8"/><polyline points="16 6 12 2 8 6"/><line x1="12" y1="2" x2="12" y2="15"/></svg>
          Share
        </div>
      </div>`;

    // Produits similaires
    const related = products.filter(x => String(x.id) !== String(p.id) && x.cat === p.cat).slice(0,4);
    const rs = document.getElementById('relatedSection');
    if (related.length) {
      rs.style.display = 'block';
      document.getElementById('relatedGrid').innerHTML = related.map(r => `
        <a href="product.html?id=${r.id}" class="product-card">
          <div class="product-img-wrap">
            <img src="${r.images&&r.images[0]?r.images[0]:''}" alt="${r.nom}" loading="lazy" onerror="this.style.display='none'">
          </div>
          <div class="product-info">
            <p class="product-brand">HOSNA KIDS</p>
            <h3 class="product-name">${r.nom}</h3>
            <p class="product-price">${Number(r.prix).toLocaleString('fr-DZ')} DA</p>
          </div>
        </a>`).join('');
    } else rs.style.display = 'none';
  });

  // ── GALERIE ──
  function changeImg(thumb, src) {
    document.getElementById('mainImg').src = src;
    document.querySelectorAll('.thumb').forEach(t => t.classList.remove('active'));
    thumb.classList.add('active');
  }

  // ── TAILLE ──
  function selectSize(btn, size, stock) {
    document.querySelectorAll('.size-chip').forEach(b => b.classList.remove('selected'));
    btn.classList.add('selected');
    selectedSize = size;
    stockDispo   = stock;
    quantite     = 1;

    // Afficher quantité
    const qs = document.getElementById('qtySection');
    if (qs) {
      qs.style.display = 'block';
      document.getElementById('qtyNum').textContent = 1;
      const sb = document.getElementById('stockBadge');
      if (stock <= 3 && stock > 0) { sb.textContent = `⚠️ Plus que ${stock} en stock !`; sb.className='stock-badge low'; }
      else if (stock === 0)        { sb.textContent = 'Rupture de stock'; sb.className='stock-badge out'; }
      else                         { sb.textContent = `${stock} disponible(s)`; sb.className='stock-badge'; }
    }
    updateTotal();
  }

  // ── QUANTITÉ ──
  function changeQty(delta) {
    const newQ = quantite + delta;
    if (newQ < 1 || newQ > stockDispo) return;
    quantite = newQ;
    document.getElementById('qtyNum').textContent = quantite;
    updateTotal();
  }

  // ── WILAYA ──
  function onWilayaChange(wilaya) {
    if (!wilaya) return;

    // Mettre à jour les communes
    updateCommunes(wilaya);

    // Mettre à jour les tarifs livraison
    const info = getLivraisonInfo(wilaya);
    document.getElementById('price-domicile').textContent = info.domicile.toLocaleString('fr-DZ') + ' DA';
    document.getElementById('price-bureau').textContent   = info.bureau.toLocaleString('fr-DZ') + ' DA';
    document.getElementById('livraisonSection').style.display = 'block';

    // Reset livraison
    selectedLivraison = '';
    prixLivraison     = 0;
    document.querySelectorAll('.livraison-card').forEach(c => c.classList.remove('selected'));
    updateTotal();
  }

  // ── TYPE LIVRAISON ──
  function selectLivraison(type) {
    const wilaya = document.getElementById('f-wilaya').value;
    const info   = getLivraisonInfo(wilaya);
    selectedLivraison = type;
    prixLivraison     = type === 'domicile' ? info.domicile : info.bureau;
    document.querySelectorAll('.livraison-card').forEach(c => c.classList.remove('selected'));
    document.getElementById('card-' + type).classList.add('selected');
    updateTotal();
  }

  // ── TOTAL ──
  function updateTotal() {
    if (!p || !selectedSize || !selectedLivraison) {
      document.getElementById('totalBox').style.display = 'none';
      return;
    }
    const prixProduit = Number(p.prix) * quantite;
    const total       = prixProduit + prixLivraison;
    document.getElementById('totalBox').style.display   = 'block';
    document.getElementById('tot-qty').textContent      = quantite;
    document.getElementById('tot-produit').textContent  = prixProduit.toLocaleString('fr-DZ') + ' DA';
    document.getElementById('tot-livraison').textContent= prixLivraison.toLocaleString('fr-DZ') + ' DA';
    document.getElementById('tot-final').textContent    = total.toLocaleString('fr-DZ') + ' DA';
  }

  // ── COMMANDE ──
  // Vérifie qu'un numéro correspond au format algérien (05/06/07 + 8 chiffres),
  // en acceptant les espaces, tirets, ou le préfixe +213.
  function isValidAlgerianPhone(tel) {
    let digits = tel.replace(/[^\d+]/g, '');
    if (digits.startsWith('+213')) digits = '0' + digits.slice(4);
    else if (digits.startsWith('213') && digits.length > 9) digits = '0' + digits.slice(3);
    return /^0[5-7][0-9]{8}$/.test(digits);
  }

  async function submitOrder() {
    const nom    = document.getElementById('f-nom').value.trim();
    const tel    = document.getElementById('f-tel').value.trim();
    const wilaya = document.getElementById('f-wilaya').value;
    const commune= document.getElementById('f-commune').value;
    if (!nom)              { alert('Veuillez entrer votre nom.');           return; }
    if (!tel)              { alert('Veuillez entrer votre numéro.');        return; }
    if (!isValidAlgerianPhone(tel)) {
      alert('⚠️ Numéro invalide.\n\nMerci d\'entrer un numéro algérien valide (10 chiffres, commençant par 05, 06 ou 07).\n\nExemple : 0555123456');
      document.getElementById('f-tel').focus();
      return;
    }
    if (!wilaya)           { alert('Veuillez choisir votre wilaya.');       return; }
    if (!selectedSize)     { alert('Veuillez choisir une taille.');         return; }
    if (!selectedLivraison){ alert('Veuillez choisir le type de livraison.'); return; }

    const btn = document.getElementById('orderBtn');
    btn.disabled = true;
    btn.textContent = '⏳ Envoi...';

    const prixProduit = Number(p.prix) * quantite;
    const total       = prixProduit + prixLivraison;

    const commande = {
      date: new Date().toLocaleString('fr-DZ'),
      nom, telephone: tel, wilaya,
      commune: commune || '—',
      produit: p.nom,
      taille: selectedSize,
      quantite: quantite,
      livraison: selectedLivraison === 'domicile' ? '🏠 Domicile' : '🏢 Bureau',
      prix_livraison: prixLivraison + ' DA',
      prix_produit: prixProduit + ' DA',
      total: total + ' DA',
      statut: 'Nouvelle commande'
    };

    try {
      // 1. Envoyer la commande vers Supabase (source principale du site)
      const { error: orderError } = await sb.from('commandes').insert(commande);
      if (orderError) throw orderError;
      orderSubmitted = true;
      dismissBuyReminder();

      // Si un enregistrement "abandon" avait déjà été envoyé pour cette visite,
      // on le supprime maintenant puisque la commande a bien été finalisée.
      if (abandonRecordId !== null) {
        sb.from('abandonnes').delete().eq('id', abandonRecordId)
          .then(({ error }) => { if (error) console.log('Abandon cleanup error:', error); });
      }

      // 1bis. Envoyer aussi vers Google Sheets (backup + email automatique)
      // Ne bloque jamais la commande si Google Sheets est indisponible.
      fetch(GOOGLE_SHEETS_URL, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(commande)
      }).catch(e => console.log('Google Sheets sync error:', e));

      // Meta Pixel : suivi de l'événement d'achat pour les campagnes publicitaires
      if (typeof fbq === 'function') {
        fbq('track', 'Purchase', {
          value: total,
          currency: 'DZD',
          content_name: p.nom,
          content_type: 'product',
          contents: [{ id: p.id, quantity: quantite }]
        });
      }

      // 2. Déduire le stock (via une fonction sécurisée, car le client n'est pas connecté)
      const { error: stockError } = await sb.rpc('decrement_stock', {
        p_id: p.id,
        p_taille: selectedSize,
        p_qty: quantite
      });
      if (stockError) console.log('Stock update error:', stockError);

      // Met à jour aussi la copie locale pour un affichage cohérent immédiatement
      const idx = products.findIndex(x => String(x.id) === String(p.id));
      if (idx >= 0) {
        if (!products[idx].stock) products[idx].stock = {};
        const current = Number(products[idx].stock[selectedSize] || 0);
        products[idx].stock[selectedSize] = Math.max(0, current - quantite);
        localStorage.setItem('hosna_products_backup', JSON.stringify(products));
      }

      document.getElementById('successMsg').innerHTML =
        `Merci <strong>${nom}</strong> ! ✅<br>
         <em>${p.nom}</em> — taille <strong>${selectedSize}</strong> × ${quantite}<br>
         Livraison <strong>${selectedLivraison === 'domicile' ? '🏠 à domicile' : '🏢 bureau'}</strong> à <strong>${wilaya}</strong><br>
         <br>
         <table style="width:100%;font-size:14px;text-align:left">
           <tr><td style="color:#6b7280">Produit</td><td style="font-weight:600">${prixProduit.toLocaleString('fr-DZ')} DA</td></tr>
           <tr><td style="color:#6b7280">Livraison</td><td style="font-weight:600">${prixLivraison.toLocaleString('fr-DZ')} DA</td></tr>
           <tr style="border-top:1px solid #e5e7eb"><td style="font-weight:700;padding-top:8px">Total</td><td style="font-weight:700;color:#e05c1a;font-size:16px;padding-top:8px">${total.toLocaleString('fr-DZ')} DA</td></tr>
         </table>
         <br>Nous vous appellerons au <strong>${tel}</strong> pour confirmer. 🚚`;
      document.getElementById('successOverlay').classList.add('show');
    } catch(err) {
      alert('Erreur réseau. Veuillez réessayer.');
    } finally {
      btn.disabled = false;
      btn.innerHTML = '🛒 اشتري الآن';
    }
  }

  // ── PANIER ABANDONNÉ ──
  // Si le client a rempli au moins son nom + téléphone mais n'a pas cliqué sur "Acheter",
  // on envoie ses infos dans l'onglet "Abandonnés" (pas "Commandes") quand il quitte la page.
  function sendAbandonIfNeeded() {
    if (orderSubmitted || abandonSent) return;

    const nomEl = document.getElementById('f-nom');
    const telEl = document.getElementById('f-tel');
    if (!nomEl || !telEl) return;

    const nom = nomEl.value.trim();
    const tel = telEl.value.trim();
    if (!tel) return; // au moins le téléphone est nécessaire pour que ce soit exploitable

    abandonSent = true;

    const wilaya  = document.getElementById('f-wilaya')?.value || '';
    const commune = document.getElementById('f-commune')?.value || '';

    const payload = {
      date: new Date().toLocaleString('fr-DZ'),
      nom: nom || '—', telephone: tel,
      wilaya: wilaya || '—',
      commune: commune || '—',
      produit: p ? p.nom : '—',
      taille: selectedSize || '—',
      quantite: quantite
    };

    sb.from('abandonnes').insert(payload).select().single().then(({ data, error }) => {
      if (error) console.log('Abandon insert error:', error);
      else if (data) abandonRecordId = data.id;
    });
  }

  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'hidden') sendAbandonIfNeeded();
  });
  window.addEventListener('pagehide', sendAbandonIfNeeded);

  // Filet de sécurité : certains navigateurs mobiles ne déclenchent pas
  // toujours pagehide/visibilitychange de façon fiable à la fermeture.
  // Délai volontairement long pour laisser le temps de remplir tout le formulaire normalement.
  setTimeout(() => {
    sendAbandonIfNeeded();
    setInterval(sendAbandonIfNeeded, 30000);
  }, 45000);

  // ── RAPPEL VISIBLE "N'oubliez pas de finaliser" ──
  let reminderShown = false;

  function isFormStarted() {
    const tel = document.getElementById('f-tel')?.value.trim();
    return !!tel && !orderSubmitted;
  }

  function showBuyReminder() {
    if (reminderShown || !isFormStarted()) return;
    reminderShown = true;
    document.getElementById('buyReminderBanner')?.classList.add('show');
  }

  function dismissBuyReminder() {
    document.getElementById('buyReminderBanner')?.classList.remove('show');
  }

  function scrollToBuyButton() {
    dismissBuyReminder();
    document.getElementById('orderBtn')?.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }

  // Déclenchement par inactivité (fonctionne sur mobile et ordinateur)
  setTimeout(showBuyReminder, 20000);

  // Déclenchement "exit intent" sur ordinateur : la souris quitte la page vers le haut
  document.addEventListener('mouseleave', (e) => {
    if (e.clientY <= 0) showBuyReminder();
  });
</script>
</body>
</html>
